<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1HO Bid Desk</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: plain, fast, nothing extra.
   IDEA: a contractor's room-by-room walkthrough card.
   PICTURE: the room list with one labor number each.
   COLOUR and TYPE: 1HO petrol, sky, coral; Archivo.
   LAYOUT: properties left, one property right; stacks on phones. */
:root{color-scheme:light dark;--bg:light-dark(#f3f6f8,#071a24);--card:light-dark(#fff,#0d2836);--ink:light-dark(#0b2330,#e6f1f6);--mute:light-dark(#567080,#8fb0c0);--line:light-dark(#d8e2e8,#1d3f50);--petrol:#034B68;--sky:#37ADDB;--coral:#F48D82;--ok:light-dark(#0f7a4b,#5fd39a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
header{background:var(--petrol);color:#fff;padding:16px max(4vw,16px)}
header h1{margin:0;font-size:28px;line-height:1.05}header p{margin:2px 0 0;color:#bfe3f2;font-size:14px}
main{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;padding:20px max(4vw,16px) 48px;max-width:1200px;margin:auto}
@media(max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
h2{font-size:22px;margin:0;line-height:1.15}
button,.btn{font:700 15px Archivo,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.pri{background:var(--sky);border-color:var(--sky);color:#04293a}.big{min-height:54px;font-size:17px;width:100%}
.ghost{border-style:dashed}.no{color:var(--coral)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:1px}
input,textarea{font:16px Archivo,sans-serif;width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
label{display:block;font-size:13px;color:var(--mute);font-weight:700;margin-bottom:3px}
.note{font-size:13px;color:var(--mute)}
.job{display:flex;width:100%;text-align:left;padding:12px;margin-top:8px;flex-direction:column;align-items:stretch;gap:2px;min-height:0}
.job.sel{border-color:var(--sky);box-shadow:0 0 0 2px var(--sky)}.job small{color:var(--mute);font-weight:500}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line)}
.p-sent{background:#FACD88;color:#3b2a00}.p-in{background:var(--ok);color:#fff}
.top{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px;margin-top:14px}
@media(max-width:600px){.top{grid-template-columns:minmax(0,1fr)}}
.room{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
.rh{display:flex;gap:10px;align-items:center;background:var(--petrol);padding:8px 10px}
.rh input{background:transparent;border:0;color:#fff;font-weight:800;font-size:17px;min-height:40px;padding:4px}
.rh input:focus{background:#0a5b7c}
.rh .price{width:130px;flex:none;background:#fff;color:#0b2330;text-align:right;font-weight:700;border-radius:8px}
.rh .x{background:transparent;border:0;color:#bfe3f2;min-height:40px;padding:0 8px;font-size:18px}
.rb{padding:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{min-height:34px;font-size:13px;font-weight:500;padding:0 10px;border-radius:99px}
.gcadd{margin-top:8px;padding:8px 10px;border-radius:8px;background:light-dark(#fff6e6,#3a2c10);font-size:14px}
.resend{background:light-dark(#fff6e6,#3a2c10);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.resp{border:1px solid var(--line);border-radius:10px;margin-top:10px;padding:10px 12px}
.resp>summary{cursor:pointer;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.resp>summary span{margin-left:auto;font-weight:800;font-size:18px}
.resp table{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px}.resp td{padding:6px 4px;border-bottom:1px solid var(--line)}.resp .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.resp .addrow td{color:var(--mute);font-style:italic}.resp .tot td{font-weight:800;border-bottom:0}
.sroom{border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:light-dark(#eaf4f9,#0a3346)}.sh span{display:flex;align-items:center;gap:6px}.sp{width:120px;text-align:right;font-weight:700}
.sl{display:grid;grid-template-columns:40px minmax(0,1fr) 100px 36px;gap:6px;align-items:center;padding:4px 10px}.ln{font-size:13px;color:var(--mute);font-weight:700}.sc{text-align:right}
.sl input{min-height:38px;font-size:15px}.x2{min-height:36px;padding:0;border:0;background:none;color:var(--mute)}
.sf{display:flex;justify-content:space-between;gap:8px;padding:4px 10px 8px;flex-wrap:wrap;align-items:center}
@media(max-width:600px){.sl{grid-template-columns:34px minmax(0,1fr) 80px 30px}}
.mats{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}.mh{display:flex;justify-content:space-between;font-size:15px}.mh span{font-weight:800}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 64px 70px 84px 84px 30px;gap:6px;align-items:center;margin-top:6px}.mrow input{min-height:38px;font-size:15px}.mrow .num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.mhead{font-size:12px;color:var(--mute);font-weight:700;margin-top:8px}.mf{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px}
@media(max-width:600px){.mrow{grid-template-columns:minmax(0,1fr) 50px 54px 64px;}.mrow .num,.mrow .x2,.mhead span:nth-child(5),.mhead span:nth-child(6){display:none}}
.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}.totals>div{background:var(--petrol);color:#fff;border-radius:12px;padding:12px 14px}.totals span{display:block;font-size:13px;color:#bfe3f2}.totals b{font-size:clamp(18px,2.4vw,24px);white-space:nowrap}.totals .all{background:#37ADDB;color:#04293a}.totals .all span{color:#04293a}
.sec{margin:18px 0 4px;font-size:16px}.mline{display:grid;grid-template-columns:minmax(0,1fr) auto 90px;gap:10px;padding:6px 10px;border-top:1px solid var(--line);font-size:15px}.mline .num{text-align:right;font-weight:700}
.lab{color:#bfe3f2;font-size:13px;font-weight:700;flex:none}
.rin{width:110px;min-height:36px;text-align:right;font-weight:700;padding:4px 8px}
#bdLogin{position:fixed;inset:0;background:rgba(3,40,56,.92);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}.bdl{background:var(--card);color:var(--ink);border-radius:14px;padding:22px;width:min(420px,100%)}.bdl h2{margin:0 0 4px}.bderr{color:var(--coral);font-weight:600;min-height:20px}
.grp{font-size:12px;font-weight:700;color:var(--mute);margin-top:10px}
.chip.on{background:var(--petrol);border-color:var(--petrol);color:#fff}
.linkish{background:none;border:0;color:var(--sky);padding:0;min-height:32px;font-size:14px}
.adds{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.adds button{min-height:38px;font-size:14px}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:14px;border-radius:12px;background:var(--petrol);color:#fff;font-weight:800;font-size:20px}
.step{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.step h3{margin:0 0 8px;font-size:17px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--petrol);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:9}
#toast.show{opacity:1}
pre{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px;font:14px/1.45 Archivo,sans-serif}
.empty{color:var(--mute);padding:16px 4px}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h1>Bid Desk</h1><p>1HO Holdings · room-by-room labor bids · saves automatically</p></div><button id="bdOut" style="background:transparent;color:#bfe3f2;border-color:#2a7a9a;min-height:36px">Sign out</button></header>
<main>
 <section class="panel">
  <button class="pri big" id="newBtn">+ New property</button>
  <div id="list"><p class="empty">Loading…</p></div>
  <details style="margin-top:18px"><summary class="note" style="cursor:pointer">Setup</summary>
   <div style="display:grid;gap:8px;margin-top:8px">
    <div><label for="s-gcName">GC name</label><input id="s-gcName" data-set="gcName"></div>
    <div><label for="s-gcPhone">GC cell</label><input id="s-gcPhone" data-set="gcPhone" type="tel"></div>
    <div><label for="s-gcEmail">GC email — scope gets emailed here</label><input id="s-gcEmail" data-set="gcEmail" type="email"></div>
    <div><label for="s-gcCompany">GC company name</label><input id="s-gcCompany" data-set="gcCompany"></div>
    <div><label for="s-myName">Your name</label><input id="s-myName" data-set="myName"></div>
    <div><label for="s-myPhone">Your cell — bids can be texted back here</label><input id="s-myPhone" data-set="myPhone" type="tel"></div>
    <div><label for="s-myEmail">Your email — bids get emailed back here</label><input id="s-myEmail" data-set="myEmail" type="email"></div>
    <div><label for="s-gcPass">Contractor portal password (give this to your GC)</label><input id="s-gcPass" data-set="gcPass" autocomplete="off"></div>
    <div class="note">Contractor portal link: <b id="gcPortalUrl"></b> <button id="copyPortal" style="min-height:34px;font-size:13px">Copy</button><br>Your GC bookmarks this, signs in with the password above, and sees every property you've sent him.</div>
    <div><label for="impFile">Import properties (Bid Desk export .json)</label><input id="impFile" type="file" accept=".json,application/json" style="padding:8px"></div>
    <div><label for="s-pageUrl">GC form link (leave blank if BidDeskGC.html sits next to this page)</label><input id="s-pageUrl" data-set="pageUrl" type="url" placeholder="https://onehouroffers.github.io/BidDeskGC.html"></div>
   </div></details>
 </section>
 <section class="panel" id="editor"><p class="empty">Pick a property or add a new one.</p></section>
</main>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
/* ===== Bid Desk portal: connects this page to the Apps Script back end (runs as holdings@) ===== */
const BID_DESK_API="https://script.google.com/macros/s/AKfycbxvNgTlW0NzR8Z_KVaP7UxZ6XTDgzVSoRIIT2oqJtPc2w0oNg0210q9Qj9lRRRPut3U/exec"; /* optional: paste your Apps Script Web app URL here so nobody has to enter it */
(function(){
 const LS={api:"bd_api",pass:"bd_pass"};const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||"";if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch{return""}};
 const cfg={api:BID_DESK_API||ls(LS.api),pass:ls(LS.pass)};
 window.BD={get api(){return cfg.api},signOut(){ls(LS.pass,null);location.reload()}};
 async function call(action,data){if(!cfg.api)throw{code:"auth"};
  const r=await fetch(cfg.api,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action,key:cfg.pass},data||{}))});
  const j=await r.json();if(j&&j.error==="auth"){showLogin("Wrong password.");throw{code:"auth"}}if(!j||!j.ok)throw{code:"tool_error",message:(j&&j.error)||"Server error"};return j}
 window.BDcall=call;
 let ready,readyRes;ready=new Promise(r=>readyRes=r);
 function showLogin(msg){let o=document.getElementById("bdLogin");if(!o){o=document.createElement("div");o.id="bdLogin";document.body.appendChild(o)}
  o.innerHTML=`<div class="bdl"><h2>1HO Bid Desk</h2><p class="note">Sign in to the portal.</p>${BID_DESK_API?"":`<label for="bdApi">Portal server link (Apps Script Web app URL)</label><input id="bdApi" type="url" value="${(cfg.api||"").replace(/"/g,"&quot;")}" placeholder="https://script.google.com/macros/s/…/exec">`}
  <label for="bdPass" style="margin-top:10px">Password</label><input id="bdPass" type="password" autocomplete="current-password"><p class="bderr">${msg||""}</p><button class="pri big" id="bdGo">Sign in</button></div>`;
  o.style.display="flex";const go=async()=>{const a=BID_DESK_API||document.getElementById("bdApi").value.trim(),p=document.getElementById("bdPass").value;
   if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(a)){o.querySelector(".bderr").textContent="Paste the Web app URL from your Apps Script deployment.";return}
   cfg.api=a;cfg.pass=p;o.querySelector(".bderr").textContent="Checking…";
   try{const r=await fetch(a,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"ping",key:p})});const j=await r.json();
    if(j.ok){ls(LS.api,a);ls(LS.pass,p);o.style.display="none";window.BD.me=j.me;readyRes()}else o.querySelector(".bderr").textContent=j.error==="auth"?"Wrong password.":"Server said: "+j.error}
   catch(z){o.querySelector(".bderr").textContent="Couldn't reach the server — check the link and that the script is deployed for Anyone."}};
  o.querySelector("#bdGo").onclick=go;o.querySelector("#bdPass").onkeydown=e=>{if(e.key==="Enter")go()}}
 document.addEventListener("DOMContentLoaded",async()=>{if(cfg.api&&cfg.pass){try{const j=await call("ping");window.BD.me=j.me;readyRes();return}catch(z){}}showLogin()});
 /* db: same calls the page already makes, stored in Drive by the back end */
 const db={doc(path){const [c,id]=path.split("/");return{
   async set(body){await ready;if(c==="settings")return call("saveSettings",{settings:body});const j=await call("saveBid",{bid:body});return j},
   async delete(){await ready;if(c==="bids")return call("deleteBid",{id})},
   onSnapshot(next,err){ready.then(()=>call("getSettings")).then(j=>next({exists:true,data:()=>j.settings||{},metadata:{fromCache:false}})).catch(e=>err&&err(e));return()=>{}}}},
  collection(){return{onSnapshot(next,err){let stop=false;const load=()=>call("listBids").then(j=>{if(!stop)next({docs:(j.bids||[]).map(b=>({data:()=>b})),metadata:{fromCache:false}})}).catch(e=>{if(e&&e.code!=="auth")err&&err(e)});
    ready.then(load);const t=setInterval(()=>{if(document.visibilityState==="visible")ready.then(load)},20000);window.BDreload=()=>ready.then(load);return()=>{stop=true;clearInterval(t)}}}}};
 /* email: sends from holdings@ through the back end */
 const mcp={async callTool(server,tool,input){await ready;if(tool==="send_message"){const j=await call("send",{to:(input.to||[])[0],subject:input.subject,body:input.body,htmlBody:input.htmlBody,attachments:input.attachments});return{payload:{threadId:j.threadId}}}throw{code:"tool_error",message:"Not available"}}};
 const downloads={async save({filename,data}){const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return{status:"saved"}}};
 window.claude={use:async n=>n==="db"?db:n==="mcp"?mcp:n==="downloads"?downloads:null};
})();

</script>

 b.sow={at:new Date().toLocaleString(),rooms:rooms.map(r=>{const lines=splitNote(r.note).map(d=>({d,c:""}));const norm=x=>x.toLowerCase().replace(/[^a-z]/g,""),low=norm(lines.map(l=>l.d).join(" "));
  for(const it of r.items)if(!low.includes(norm(it.split(/[ /]/)[0]))&&!low.includes(norm(it)))lines.push({d:it,c:""});
  for(const a of r.added||[])lines.push({d:cap(a.item)+" (contractor addition)",c:a.labor||""});
  if(!lines.length)lines.push({d:"Per walkthrough",c:""});
  return{id:r.id,name:r.name,price:String(roomSum(r)||""),lines}})}}

 db.doc("settings/main").onSnapshot(s=>{if(s.exists)settings={...settings,...s.data()};if(settings.gcEmail&&!(settings.gcEmails||[]).length)settings.gcEmails=[settings.gcEmail];document.querySelectorAll("[data-set]").forEach(el=>{if(document.activeElement!==el)el.value=settings[el.dataset.set]||""});const a=document.activeElement;if(!(a&&ed.contains(a)))render()},()=>{});
 db.collection("bids").onSnapshot(s=>{if(!s.metadata.fromCache)clearTimeout(timer);const local=new Map(bids.map(b=>[b.id,b]));
  bids=s.docs.map(d=>{const b=JSON.parse(JSON.stringify(d.data()));if(q[b.id]&&local.has(b.id)){const l=local.get(b.id),have=new Set((l.inbox||[]).map(x=>x.sid));for(const it of b.inbox||[])if(!have.has(it.sid))(l.inbox=l.inbox||[]).push(it);return l}return fix(b)});
  let newBids=0;for(const b of bids)newBids+=processInbox(b);
  for(const b of local.values())if(!bids.some(x=>x.id===b.id)&&q[b.id])bids.push(b);
  renderList();const a=document.activeElement;if(newBids||!(a&&ed.contains(a)&&/INPUT|TEXTAREA/.test(a.tagName)))render()},
  ()=>{clearTimeout(timer);$("#list").innerHTML='<p class="empty">Saved bids couldn\'t load here.</p>'})})();
}
