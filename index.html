<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1HO Bid Desk</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: plain, fast, nothing extra.
   IDEA: a contractor's room-by-room walkthrough card.
   PICTURE: the room list with one labor number each.
   COLOUR and TYPE: 1HO petrol, sky, coral; Archivo.
   LAYOUT: properties left, one property right; stacks on phones. */
:root{color-scheme:light;--bg:light-dark(#f3f6f8,#071a24);--card:light-dark(#fff,#0d2836);--ink:light-dark(#0b2330,#e6f1f6);--mute:light-dark(#567080,#8fb0c0);--line:light-dark(#d8e2e8,#1d3f50);--petrol:#034B68;--sky:#37ADDB;--coral:#F48D82;--ok:light-dark(#0f7a4b,#5fd39a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
header{background:var(--petrol);color:#fff;padding:16px max(4vw,16px)}
header h1{margin:0;font-size:28px;line-height:1.05}header p{margin:2px 0 0;color:#bfe3f2;font-size:14px}
main{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;padding:20px max(4vw,16px) 48px;max-width:1200px;margin:auto}
@media(max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
h2{font-size:22px;margin:0;line-height:1.15}
button,.btn{font:700 15px Archivo,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.pri{background:var(--sky);border-color:var(--sky);color:#04293a}.big{min-height:54px;font-size:17px;width:100%}
.ghost{border-style:dashed}.no{color:var(--coral)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:1px}
input,textarea{font:16px Archivo,sans-serif;width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
label{display:block;font-size:13px;color:var(--mute);font-weight:700;margin-bottom:3px}
.note{font-size:13px;color:var(--mute)}
.job{display:flex;width:100%;text-align:left;padding:12px;margin-top:8px;flex-direction:column;align-items:stretch;gap:2px;min-height:0}
.job.sel{border-color:var(--sky);box-shadow:0 0 0 2px var(--sky)}.job small{color:var(--mute);font-weight:500}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line)}
.p-sent{background:#FACD88;color:#3b2a00}.p-in{background:var(--ok);color:#fff}
.top{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px;margin-top:14px}
@media(max-width:600px){.top{grid-template-columns:minmax(0,1fr)}}
.room{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
.rh{display:flex;gap:10px;align-items:center;background:var(--petrol);padding:8px 10px}
.rh input{background:transparent;border:0;color:#fff;font-weight:800;font-size:17px;min-height:40px;padding:4px}
.rh input:focus{background:#0a5b7c}
.rh .price{width:130px;flex:none;background:#fff;color:#0b2330;text-align:right;font-weight:700;border-radius:8px}
.rh .x{background:transparent;border:0;color:#bfe3f2;min-height:40px;padding:0 8px;font-size:18px}
.rb{padding:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{min-height:34px;font-size:13px;font-weight:500;padding:0 10px;border-radius:99px}
.gcadd{margin-top:8px;padding:8px 10px;border-radius:8px;background:light-dark(#fff6e6,#3a2c10);font-size:14px}
.resend{background:light-dark(#fff6e6,#3a2c10);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.resp{border:1px solid var(--line);border-radius:10px;margin-top:10px;padding:10px 12px}
.resp>summary{cursor:pointer;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.resp>summary span{margin-left:auto;font-weight:800;font-size:18px}
.resp table{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px}.resp td{padding:6px 4px;border-bottom:1px solid var(--line)}.resp .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.resp .addrow td{color:var(--mute);font-style:italic}.resp .tot td{font-weight:800;border-bottom:0}
.sroom{border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:light-dark(#eaf4f9,#0a3346)}.sh span{display:flex;align-items:center;gap:6px}.sp{width:120px;text-align:right;font-weight:700}
.sl{display:grid;grid-template-columns:40px minmax(0,1fr) 100px 36px;gap:6px;align-items:center;padding:4px 10px}.ln{font-size:13px;color:var(--mute);font-weight:700}.sc{text-align:right}
.sl input{min-height:38px;font-size:15px}.x2{min-height:36px;padding:0;border:0;background:none;color:var(--mute)}
.sf{display:flex;justify-content:space-between;gap:8px;padding:4px 10px 8px;flex-wrap:wrap;align-items:center}
@media(max-width:600px){.sl{grid-template-columns:34px minmax(0,1fr) 80px 30px}}
.mats{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}.mh{display:flex;justify-content:space-between;font-size:15px}.mh span{font-weight:800}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 64px 70px 84px 84px 30px;gap:6px;align-items:center;margin-top:6px}.mrow input{min-height:38px;font-size:15px}.mrow .num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.mhead{font-size:12px;color:var(--mute);font-weight:700;margin-top:8px}.mf{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px}
@media(max-width:600px){.mrow{grid-template-columns:minmax(0,1fr) 50px 54px 64px;}.mrow .num,.mrow .x2,.mhead span:nth-child(5),.mhead span:nth-child(6){display:none}}
.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}.totals>div{background:var(--petrol);color:#fff;border-radius:12px;padding:12px 14px}.totals span{display:block;font-size:13px;color:#bfe3f2}.totals b{font-size:clamp(18px,2.4vw,24px);white-space:nowrap}.totals .all{background:#37ADDB;color:#04293a}.totals .all span{color:#04293a}
.sec{margin:18px 0 4px;font-size:16px}.mline{display:grid;grid-template-columns:minmax(0,1fr) auto 90px;gap:10px;padding:6px 10px;border-top:1px solid var(--line);font-size:15px}.mline .num{text-align:right;font-weight:700}
.lab{color:#bfe3f2;font-size:13px;font-weight:700;flex:none}
.rin{width:110px;min-height:36px;text-align:right;font-weight:700;padding:4px 8px}
#bdLogin{position:fixed;inset:0;background:rgba(3,40,56,.92);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}.bdl{background:var(--card);color:var(--ink);border-radius:14px;padding:22px;width:min(420px,100%)}.bdl h2{margin:0 0 4px}.bderr{color:var(--coral);font-weight:600;min-height:20px}
.subb{background:#FACD88;color:#3b2a00;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap;flex:none}
.inadd{margin-top:8px}.inadd button{width:100%;min-height:46px;border-style:dashed;border-color:var(--sky);color:light-dark(var(--petrol),var(--sky));font-weight:700}
.savest{font-size:13px;font-weight:600;color:var(--mute)}.savest.ok{color:var(--ok)}.savest.warn{color:var(--coral)}
.subrow{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.subrow label{margin:0}.subrow select{flex:1 1 220px;min-height:40px;font-size:15px}
.subcard{margin-top:8px;padding:10px 12px;border-radius:10px;background:light-dark(#fff6e6,#3a2c10);border:1px solid light-dark(#f3dcaa,#6b5320)}
.subform{margin-top:8px;padding:10px;border:1px dashed var(--sky);border-radius:10px}.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.sg input,.sg select{min-height:40px;font-size:15px}
.subdir{padding:8px 0;border-top:1px solid var(--line);font-size:14px}.subb.ours{background:#37ADDB;color:#04293a}
.go{background:var(--ok);border-color:var(--ok);color:#fff}
.reccard{margin-top:8px;padding:10px 12px;border-radius:10px;border:2px solid #FACD88;background:light-dark(#fffaf0,#3a2c10)}
.totals .cont{background:#FACD88;color:#3b2a00}.totals .cont span{color:#5a4510}.totals .cont input{width:52px;min-height:28px;padding:2px 6px;font-size:14px;display:inline-block;text-align:right}.totals .cont em{font-style:normal;font-size:11px}
.home{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}@media(max-width:600px){.home{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tk{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}.tkrow{display:grid;grid-template-columns:minmax(0,1fr) 70px 48px 80px 80px;gap:6px;align-items:center;padding:3px 0;font-size:14px}.tkrow input{min-height:34px;font-size:14px;padding:4px 6px;text-align:right}.tkrow span:last-child{text-align:right;font-weight:700}.tkhead{font-size:12px;color:var(--mute);font-weight:700}
@media(max-width:600px){.tkrow{grid-template-columns:minmax(0,1fr) 56px 40px 64px 66px;font-size:13px}}
#pkgSel{width:100%;min-height:44px;font-weight:700}#pkgSel.pick{border:2px solid var(--sky);background:#eaf4f9}
.warnbox{margin:8px 0;padding:8px 10px;border-radius:10px;background:#fff6e6;border:1px solid #f3dcaa;color:#3a2c10;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.warnbox b{flex:1 1 200px}.fin.undec{border-color:#e0b25a;background:#fffaf0}
.okbox{background:#dff5ea;border-color:#9fd9bb;color:#0f5a38}.quick{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0;font-size:14px;color:var(--mute)}.quick button{min-height:34px;padding:4px 12px}
.negrow{grid-template-columns:minmax(0,1fr) 90px 110px}.negrow span:nth-child(2){text-align:right;color:var(--mute)}.negtot{border-top:2px solid var(--line);font-weight:800;padding-top:6px}.negtot span:nth-child(2){font-weight:700}
.pkgrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pkgrow select{flex:1 1 200px;min-height:42px}
.fins{display:grid;gap:8px;margin-top:10px}.fin{display:flex;gap:6px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px}.fg{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}.fg input,.fg select{min-height:38px;font-size:14px;width:100%;min-width:0;box-sizing:border-box}.fg label{font-size:12px}
.grp{font-size:12px;font-weight:700;color:var(--mute);margin-top:10px}
.chip.on{background:var(--petrol);border-color:var(--petrol);color:#fff}
.linkish{background:none;border:0;color:var(--sky);padding:0;min-height:32px;font-size:14px}
.adds{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.adds button{min-height:38px;font-size:14px}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:14px;border-radius:12px;background:var(--petrol);color:#fff;font-weight:800;font-size:20px}
.step{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.step h3{margin:0 0 8px;font-size:17px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--petrol);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:9}
#toast.show{opacity:1}
pre{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px;font:14px/1.45 Archivo,sans-serif}
.empty{color:var(--mute);padding:16px 4px}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h1>Bid Desk</h1><p>1HO Holdings · room-by-room labor bids · saves automatically</p></div><button id="bdOut" style="background:transparent;color:#bfe3f2;border-color:#2a7a9a;min-height:36px">Sign out</button></header>
<main>
 <section class="panel">
  <button class="pri big" id="newBtn">+ New property</button>
  <div id="list"><p class="empty">Loading…</p></div>
  <details id="pkgBox" style="margin-top:18px"><summary class="note" style="cursor:pointer">Finish packages</summary><div id="pkgList" style="margin-top:8px;display:grid;gap:6px"></div></details>
  <details id="subsBox" style="margin-top:12px"><summary class="note" style="cursor:pointer">Subs <span id="subsCount"></span></summary><div id="subsList" style="margin-top:8px"></div></details>
  <details style="margin-top:12px"><summary class="note" style="cursor:pointer">Setup</summary>
   <div style="display:grid;gap:8px;margin-top:8px">
    <div><label for="s-gcName">GC name</label><input id="s-gcName" data-set="gcName"></div>
    <div><label for="s-gcPhone">GC cell</label><input id="s-gcPhone" data-set="gcPhone" type="tel"></div>
    <div><label for="s-gcEmail">GC email — scope gets emailed here</label><input id="s-gcEmail" data-set="gcEmail" type="email"></div>
    <div><label for="s-gcCompany">GC company name</label><input id="s-gcCompany" data-set="gcCompany"></div>
    <div><label for="s-myName">Your name</label><input id="s-myName" data-set="myName"></div>
    <div><label for="s-myPhone">Your cell — bids can be texted back here</label><input id="s-myPhone" data-set="myPhone" type="tel"></div>
    <div><label for="s-myEmail">Your email — bids get emailed back here</label><input id="s-myEmail" data-set="myEmail" type="email"></div>
    <div><label for="s-gcPass">Contractor portal password (give this to your GC)</label><input id="s-gcPass" data-set="gcPass" autocomplete="off"></div>
    <div class="note">Contractor portal link: <b id="gcPortalUrl"></b> <button id="copyPortal" style="min-height:34px;font-size:13px">Copy</button><br>Your GC bookmarks this, signs in with the password above, and sees every property you've sent him.</div>
    <div><label for="impFile">Import properties (Bid Desk export .json)</label><input id="impFile" type="file" accept=".json,application/json" style="padding:8px"></div>
    <div><label for="s-pageUrl">GC portal link (leave blank to use onehouroffers.github.io/BidDeskGC/)</label><input id="s-pageUrl" data-set="pageUrl" type="url" placeholder="https://onehouroffers.github.io/BidDeskGC.html"></div>
   </div></details>
 </section>
 <section class="panel" id="editor"><p class="empty">Pick a property or add a new one.</p></section>
</main>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
/* ===== Bid Desk portal: connects this page to the Apps Script back end (runs as holdings@) ===== */
const BID_DESK_API="https://script.google.com/macros/s/AKfycbxvNgTlW0NzR8Z_KVaP7UxZ6XTDgzVSoRIIT2oqJtPc2w0oNg0210q9Qj9lRRRPut3U/exec"; /* optional: paste your Apps Script Web app URL here so nobody has to enter it */
(function(){
 const LS={api:"bd_api",pass:"bd_pass"};const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||"";if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch{return""}};
 const cfg={api:BID_DESK_API||ls(LS.api),pass:ls(LS.pass)};
 window.BD={get api(){return cfg.api},signOut(){ls(LS.pass,null);location.reload()}};
 async function call(action,data){if(!cfg.api)throw{code:"auth"};
  const bodyStr=JSON.stringify(Object.assign({action,key:cfg.pass},data||{}));const r=await fetch(cfg.api,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:bodyStr,keepalive:bodyStr.length<60000});
  const j=await r.json();if(j&&j.error==="auth"){showLogin("Wrong password.");throw{code:"auth"}}if(!j||!j.ok)throw{code:"tool_error",message:(j&&j.error)||"Server error"};return j}
 window.BDcall=call;
 let ready,readyRes;ready=new Promise(r=>readyRes=r);
 function showLogin(msg){let o=document.getElementById("bdLogin");if(!o){o=document.createElement("div");o.id="bdLogin";document.body.appendChild(o)}
  o.innerHTML=`<div class="bdl"><h2>1HO Bid Desk</h2><p class="note">Sign in to the portal.</p>${BID_DESK_API?"":`<label for="bdApi">Portal server link (Apps Script Web app URL)</label><input id="bdApi" type="url" value="${(cfg.api||"").replace(/"/g,"&quot;")}" placeholder="https://script.google.com/macros/s/…/exec">`}
  <label for="bdPass" style="margin-top:10px">Password</label><input id="bdPass" type="password" autocomplete="current-password"><p class="bderr">${msg||""}</p><button class="pri big" id="bdGo">Sign in</button></div>`;
  o.style.display="flex";const go=async()=>{const a=BID_DESK_API||document.getElementById("bdApi").value.trim(),p=document.getElementById("bdPass").value;
   if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(a)){o.querySelector(".bderr").textContent="Paste the Web app URL from your Apps Script deployment.";return}
   cfg.api=a;cfg.pass=p;o.querySelector(".bderr").textContent="Checking…";
   try{const r=await fetch(a,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"ping",key:p})});const j=await r.json();
    if(j.ok){ls(LS.api,a);ls(LS.pass,p);o.style.display="none";window.BD.me=j.me;readyRes()}else o.querySelector(".bderr").textContent=j.error==="auth"?"Wrong password.":"Server said: "+j.error}
   catch(z){o.querySelector(".bderr").textContent="Couldn't reach the server — check the link and that the script is deployed for Anyone."}};
  o.querySelector("#bdGo").onclick=go;o.querySelector("#bdPass").onkeydown=e=>{if(e.key==="Enter")go()}}
 document.addEventListener("DOMContentLoaded",async()=>{if(cfg.api&&cfg.pass){try{const j=await call("ping");window.BD.me=j.me;readyRes();return}catch(z){}}showLogin()});
 /* db: same calls the page already makes, stored in Drive by the back end */
 const db={doc(path){const [c,id]=path.split("/");return{
   async set(body){await ready;if(c==="settings")return call("saveSettings",{settings:body});const j=await call("saveBid",{bid:body});return j},
   async delete(){await ready;if(c==="bids")return call("deleteBid",{id})},
   onSnapshot(next,err){ready.then(()=>call("getSettings")).then(j=>next({exists:true,data:()=>j.settings||{},metadata:{fromCache:false}})).catch(e=>err&&err(e));return()=>{}}}},
  collection(){return{onSnapshot(next,err){let stop=false;const load=()=>call("listBids").then(j=>{if(!stop)next({docs:(j.bids||[]).map(b=>({data:()=>b})),metadata:{fromCache:false}})}).catch(e=>{if(e&&e.code!=="auth")err&&err(e)});
    ready.then(load);const t=setInterval(()=>{if(document.visibilityState==="visible")ready.then(load)},20000);window.BDreload=()=>ready.then(load);return()=>{stop=true;clearInterval(t)}}}}};
 /* email: sends from holdings@ through the back end */
 const mcp={async callTool(server,tool,input){await ready;if(tool==="send_message"){const j=await call("send",{to:(input.to||[])[0],subject:input.subject,body:input.body,htmlBody:input.htmlBody,attachments:input.attachments});return{payload:{threadId:j.threadId}}}throw{code:"tool_error",message:"Not available"}}};
 const downloads={async save({filename,data}){const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return{status:"saved"}}};
 window.claude={use:async n=>n==="db"?db:n==="mcp"?mcp:n==="downloads"?downloads:null};
})();

</script>
<script>
{
/* full checklist catalog: [group, items] per room type */
const G={
 walls:["Walls & ceiling",["Drywall patch","Replace drywall","Plaster repair","Remove drop ceiling","New ceiling drywall","Popcorn removal","Wall texture","Water-stain repair","Mold remediation","Paint walls","Paint ceiling"]],
 floors:["Floors",["LVP","Carpet","Carpet pad","Refinish hardwood","Tile","Subfloor repair","Floor leveling","Baseboards","Quarter round","Transition strips","Thresholds"]],
 trim:["Doors & trim",["Interior door","Door jamb / casing","Door knob / lever","Hinges","Door stop","Closet doors","Bifold doors","Closet rod & shelf","Window casing","Crown molding","Paint trim","Paint doors"]],
 windows:["Windows",["Replace window","Window repair","Broken glass","Sash balance / cords","Window locks","Screens","Blinds","Window sill"]],
 elec:["Electrical",["Outlets","Outlet covers","Switches","Switch plates","GFCI outlet","AFCI protection","3-way switch","Light fixture","Can lights","Ceiling fan","Fan-rated box","Junction box covers","Open splices / bad wiring","Smoke detector","CO detector","Cable / data jack"]],
 heat:["Heat & air",["Supply registers","Return grille","Radiator removal","Baseboard heat","Thermostat"]],
 misc:["Other",["Trash-out","Deep clean","Pest treatment"]]};

 if(d.adel){const [ri,k]=d.adel.split(":");b.rooms[+ri].added.splice(+k,1);save(b);render();return}
 if(d.check){openCheck.has(d.check)?openCheck.delete(d.check):openCheck.add(d.check);render();return}
 if(d.add){const nr=room(b,d.add);b.rooms.push(nr);sortRooms(b);save(b);render();const el=ed.querySelector(`[data-rid="${nr.id}"]`);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});const ti=el.querySelector('[data-rk="note"]');if(ti)setTimeout(()=>ti.focus({preventScroll:true}),350)}return}
 if(d.rdel!==undefined){if(d.sure){b.rooms.splice(+d.rdel,1);save(b);render()}else{d.sure=1;t.textContent="Remove?"}return}
 if(t.id==="del"){if(d.sure){bids=bids.filter(x=>x.id!==b.id);sel=null;db&&db.doc("bids/"+b.id).delete().catch(()=>{});renderList();render()}else{d.sure=1;t.textContent="Tap again to delete"}return}
 if(t.id==="pdf"){const bytes=await gcPdf(b);if(!bytes)return;if(!dl){toast("Downloads aren't available in this view");return}try{await dl.save({filename:pdfName(b),data:new Blob([bytes],{type:"application/pdf"})});toast("PDF saved")}catch(x){if(x&&x.code!=="declined")toast("Couldn't save the PDF here")}return}
 if(t.id==="emailGc"){if(t.disabled)return;if(!settings.gcEmail){toast("Type "+(settings.gcName||"the GC")+"'s email in the box above first");$("#sendTo")?.focus();return}const st=$("#sendStatus");
  if(!mcp){st.textContent="Sending from here needs the page open on claude.ai with Gmail connected. Use Download PDF instead.";return}
  if(!t.dataset.sure){t.dataset.sure=1;t.textContent=`Send to ${settings.gcEmail}?`;return}
  t.disabled=true;t.textContent="Sending…";
  const bytes=await gcPdf(b);if(!bytes){t.disabled=false;t.textContent="Try again";delete t.dataset.sure;return}
  const b64=b64of(bytes),g=(settings.gcName||"").split(" ")[0]||"Hi";
  const link=await gcLink(b),mail=bidEmail(b,link,g);
  const body=mail.text,htmlBody=mail.html;
  try{const res=await mcp.callTool("Gmail","send_message",{to:[settings.gcEmail],subject:`Scope of Work — ${b.address} [${b.id}]`,body,htmlBody,attachments:[{content:b64,filename:pdfName(b),mimeType:"application/pdf"}]});const tid=res&&res.payload&&res.payload.threadId;if(tid)b.threadId=tid;
   b.emailedAt=new Date().toLocaleString();(b.sends=b.sends||[]).push({at:b.emailedAt,how:"emailed",to:settings.gcEmail});rememberMail(settings.gcEmail);markSent(b);save(b);render();toast("Scope of Work emailed")}
  catch(x){t.disabled=false;t.textContent="Try again";delete t.dataset.sure;const c=x&&x.code;
   st.textContent=c==="server_not_connected"?"Connect Gmail in claude.ai Settings → Connectors, then try again.":c==="needs_reauth"?"Reconnect Gmail in claude.ai Settings → Connectors, then try again.":c==="approval_required"||c==="not_in_manifest"?"Sending needs your OK — allow Gmail for this page when claude.ai asks.":c==="server_unavailable"||c==="upstream_error"?"Gmail didn't confirm — check your Sent folder before trying again.":"Couldn't send: "+(x&&x.message||"unknown error")}
  return}
 if(t.id==="copy"){const lk=await gcLink(b);const m=lk?`${(settings.gcName||"").split(" ")[0]||"Hey"} — need a labor bid on ${b.address}${b.dueDate?" by "+b.dueDate:""}. Tap this, put your price on each area, add anything I missed, and hit Send:\n${lk}`:message(b);(b.sends=b.sends||[]).push({at:new Date().toLocaleString(),how:"copied to text"});b.status=b.status==="in"?"in":"sent";b.sentAt=today();save(b);render();renderList();try{await navigator.clipboard.writeText(m);toast("Copied — paste it into a text")}catch{ed.insertAdjacentHTML("beforeend",`<pre>${esc(m)}</pre>`)}return}
 if(t.id==="parse"){const txt=$("#paste").value;const n=applyReply(b,txt,"text");if(n){$("#paste").value="";save(b);renderList();render();toast(`Logged ${n} price${n===1?"":"s"}`)}else toast("Couldn't find room numbers in that text");return}
 if(t.id==="checkMail"){await checkMail(b);return}
 if(t.id==="formLink"&&t.getAttribute("href")==="#"){e.preventDefault();toast("Still building the link — tap again");return}
 if(t.id==="copyForm"){const l=await gcLink(b);if(!l)return;try{await navigator.clipboard.writeText(l);toast("Bid form link copied")}catch{ed.insertAdjacentHTML("beforeend",`<pre>${esc(l)}</pre>`)}return}
 if(d.madd!==undefined){const r=b.rooms[+d.madd];(r.mats=r.mats||[]).push({d:"",q:"",u:"ea",c:""});save(b);render();const ins=ed.querySelectorAll(`[data-m="${d.madd}"][data-mk="d"]`);ins[ins.length-1]?.focus();return}
 if(d.msug!==undefined){const n=suggestMats(b.rooms[+d.msug]);save(b);render();toast(n?`Added ${n} material${n===1?"":"s"} — fill in qty and price`:"Nothing new to suggest from this room");return}
 if(d.mdel){const [i,k]=d.mdel.split(":");b.rooms[+i].mats.splice(+k,1);save(b);render();return}
 if(t.id==="shopCsv"){const rows=[["Room","Item","Qty","Unit","Cost each","Total"]];for(const r of matRooms(b))for(const m of r.mats||[])if(m.d.trim())rows.push([r.name,m.d,m.q,m.u,m.c,matSum(m)?matSum(m).toFixed(2):""]);
  if(rows.length<2){toast("Add materials to a room first");return}rows.push(["","","","","Total",matsAll(b).toFixed(2)]);
  const csv=rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  if(!dl){toast("Downloads aren't available in this view");return}try{await dl.save({filename:pdfName(b).replace("Scope-of-Work","Materials").replace(".pdf",".csv"),data:csv});toast("Shopping list saved")}catch(z){if(z&&z.code!=="declined")toast("Couldn't save here")}return}
 if(t.id==="buildSow"){buildSow(b);save(b);render();$("#sow").scrollIntoView({behavior:"smooth"});return}
 if(t.id==="rebuildSow"){if(d.sure){buildSow(b);save(b);render();toast("Rebuilt from rooms")}else{d.sure=1;t.textContent="Tap again — replaces your line edits"}return}
 if(t.id==="sowPdf"){const x=sow(b,true);if(!x)return;if(!dl){toast("Downloads aren't available in this view");return}try{await dl.save({filename:pdfName(b).replace("Scope-of-Work","Scope-of-Work-Line-Items"),data:x.output("blob")});toast("PDF saved")}catch(z){if(z&&z.code!=="declined")toast("Couldn't save the PDF here")}return}
 if(d.sadd!==undefined){b.sow.rooms[+d.sadd].lines.push({d:"",c:""});save(b);render();const ins=ed.querySelectorAll(`[data-s="${d.sadd}"][data-lk="d"]`);ins[ins.length-1]?.focus();return}
 if(d.sdel){const [k,m]=d.sdel.split(":");b.sow.rooms[+k].lines.splice(+m,1);save(b);render();return}
 if(d.useResp!==undefined){const r=b.responses[+d.useResp];for(const x of b.rooms){const v=r.rooms.find(y=>y.id===x.id);x.labor=v?v.labor:"";x.added=v?JSON.parse(JSON.stringify(v.added||[])):[]}save(b);render();toast("Using that bid");return}});
document.getElementById("bdOut").onclick=()=>window.BD.signOut();
const portalUrl=()=>((settings.pageUrl||"").trim()||"https://onehouroffers.github.io/BidDeskGC/").split("#")[0];
document.getElementById("gcPortalUrl").textContent=portalUrl();
document.getElementById("copyPortal").onclick=async()=>{try{await navigator.clipboard.writeText(portalUrl());toast("Contractor portal link copied")}catch{toast(portalUrl())}};
document.getElementById("impFile").addEventListener("change",async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
 try{const data=JSON.parse(await f.text());const list=Array.isArray(data)?data:(data.bids||[]);let n=0;
  for(const b of list){if(!b||!b.id)continue;if(bids.some(x=>x.id===b.id)&&!confirmImport(b))continue;await window.BDcall("saveBid",{bid:fix(b)});n++}
  if(data.settings&&!settings.gcEmail){await window.BDcall("saveSettings",{settings:{...data.settings,...settings}})}
  await window.BDreload();toast(`Imported ${n} propert${n===1?"y":"ies"}`)}catch(z){toast("Couldn't read that file")}e.target.value=""});
function confirmImport(b){return false}
document.querySelectorAll("#setup [data-set], aside [data-set], .panel:first-child [data-set]").forEach(el=>el.addEventListener("input",()=>{settings[el.dataset.set]=el.value.trim();saveSettings();render()}));
const okMail=m=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m);
function rememberMail(m){m=String(m||"").trim();if(!okMail(m))return false;settings.gcEmails=settings.gcEmails||[];if(!settings.gcEmails.some(x=>x.toLowerCase()===m.toLowerCase()))settings.gcEmails.push(m);settings.gcEmail=m;saveSettings();const o=document.getElementById("s-gcEmail");if(o)o.value=m;return true}
ed.addEventListener("input",e=>{const t=e.target;if(t.id==="sendTo"){settings.gcEmail=t.value.trim();saveSettings();const o=document.getElementById("s-gcEmail");if(o)o.value=settings.gcEmail;const n=$("#toSaved");if(n)n.textContent=okMail(settings.gcEmail)?"Press Save to keep this email.":"Type the GC's full email."}});
ed.addEventListener("keydown",e=>{if(e.target.id==="sendTo"&&e.key==="Enter"){e.preventDefault();$("#saveTo").click()}});
ed.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
 if(t.id==="saveTo"){const v=$("#sendTo").value;if(rememberMail(v)){render();toast("GC email saved")}else toast("That doesn't look like a full email");return}
 if(t.dataset.usemail!==undefined){rememberMail(settings.gcEmails[+t.dataset.usemail]);render();toast("Sending to "+settings.gcEmail);return}
 if(t.dataset.delmail!==undefined){const m=settings.gcEmails[+t.dataset.delmail];if(!t.dataset.sure){t.dataset.sure=1;t.textContent="Forget?";return}
  settings.gcEmails.splice(+t.dataset.delmail,1);if(settings.gcEmail===m)settings.gcEmail="";saveSettings();const o=document.getElementById("s-gcEmail");if(o)o.value=settings.gcEmail;render();toast("Forgot "+m)}});

/* boot */
renderList();
let mcp=null,dl=null;
(async()=>{try{dl=await window.claude?.use("downloads")}catch{}try{mcp=await window.claude?.use("mcp")}catch{}})();
(async()=>{try{db=await window.claude?.use("db")}catch{}
 if(!db){$("#list").innerHTML='<p class="empty">Sign in to load your properties.</p>';return}
 const timer=setTimeout(()=>{if(!bids.length)$("#list").innerHTML='<p class="empty">Can\'t reach saved bids yet — still trying.</p>'},10000);
 db.doc("settings/main").onSnapshot(s=>{if(s.exists)settings={...settings,...s.data()};if(settings.gcEmail&&!(settings.gcEmails||[]).length)settings.gcEmails=[settings.gcEmail];document.querySelectorAll("[data-set]").forEach(el=>{if(document.activeElement!==el)el.value=settings[el.dataset.set]||""});renderSubs();const a=document.activeElement;if(!(a&&ed.contains(a)))render()},()=>{});
 db.collection("bids").onSnapshot(s=>{if(!s.metadata.fromCache)clearTimeout(timer);const local=new Map(bids.map(b=>[b.id,b]));
  bids=s.docs.map(d=>{const b=JSON.parse(JSON.stringify(d.data()));if(q[b.id]&&local.has(b.id)){const l=local.get(b.id),have=new Set((l.inbox||[]).map(x=>x.sid));for(const it of b.inbox||[])if(!have.has(it.sid))(l.inbox=l.inbox||[]).push(it);return l}const was=(b.rooms||[]).map(r=>r.id).join();fix(b);if(was&&was!==b.rooms.map(r=>r.id).join())setTimeout(()=>save(b),0);return b});
  if(!window.__draftsChecked){window.__draftsChecked=1;bids=restoreDrafts(bids).map(b=>fix(b))}
  let newBids=0;for(const b of bids)newBids+=processInbox(b);
  for(const b of local.values())if(!bids.some(x=>x.id===b.id)&&q[b.id])bids.push(b);
  renderList();const a=document.activeElement;if(newBids||!(a&&ed.contains(a)&&/INPUT|TEXTAREA/.test(a.tagName)))render()},
  ()=>{clearTimeout(timer);$("#list").innerHTML='<p class="empty">Saved bids couldn\'t load here.</p>'})})();
}
